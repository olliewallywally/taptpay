# Added 2026-09-09. The default rule set has no detector for a connection URI
# carrying an inline password, so the production database credential sat in
# origin/main's tip tree unflagged by every scan. Deliberately NOT anchored with
# \b: the transcript that carried it reads "...set in shell: YESpostgresql://",
# with the scheme glued to preceding output, and a word boundary there matches
# nothing. Over-matching a scheme is cheap; missing a live credential is not. See
# docs/evidence/remediation-v2-2/r0/R0-T8-production-db-credential-2026-09-09.md.
[[rules]]
id = "connection-uri-password"
description = "Database or broker connection URI carrying an inline password"
regex = '''(?i)(?:postgres(?:ql)?|mysql|mongodb(?:\+srv)?|redis|rediss|amqps?)://[^\s:/@"'\\]{1,64}:([^\s@"'\\]{6,128})@[^\s/"'\\]{3,}'''
secretGroup = 1
keywords = ["postgres://", "postgresql://", "mysql://", "mongodb://", "mongodb+srv://", "redis://", "rediss://", "amqp://", "amqps://"]

  # A redacted or templated password is not a leak. Anchored on the whole secret
  # so a real password containing one of these substrings still fires.
  [[rules.allowlists]]
  description = "Redacted, templated or self-describing placeholder passwords"
  condition = "OR"
  regexTarget = "secret"
  regexes = [
    '''^\*+$''',
    '''^(?i)(?:password|passwd|pass|secret|your[-_]?password|changeme|example|placeholder|redacted|xxx+)$''',
    '''^[$][{(]?[A-Za-z_][A-Za-z0-9_]*[})]?$''',
    '''^<[^>]+>$''',
  ]
