<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>TaptPay Phone 3D Model</title>
    <style>
      :root {
        color-scheme: dark;
        --blue: #5e9dff;
        --navy: #040d6d;
        --cream: #f4f1e8;
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        width: 100%;
        min-height: 100%;
        margin: 0;
      }

      body {
        display: grid;
        min-height: 100vh;
        place-items: center;
        overflow: hidden;
        background:
          radial-gradient(circle at 50% 42%, rgba(47, 87, 255, 0.2), transparent 32rem),
          var(--navy);
        font-family: Arial, sans-serif;
      }

      .phone-stage {
        width: min(92vw, 360px);
        height: min(92vh, 740px);
        display: grid;
        place-items: center;
        perspective: 1100px;
        cursor: grab;
        touch-action: none;
        user-select: none;
      }

      .phone-stage:active {
        cursor: grabbing;
      }

      .phone {
        position: relative;
        width: min(255px, 70vw);
        height: min(545px, 80vh);
        min-height: 420px;
        padding: clamp(6px, 0.9vh, 9px);
        border: 0;
        border-radius: clamp(32px, 4.2vh, 46px);
        background: #0b0b14;
        box-shadow:
          0 40px 70px rgba(0, 0, 0, 0.45),
          inset 0 0 0 2px rgba(120, 140, 220, 0.35),
          inset 8px 0 12px rgba(255, 255, 255, 0.04);
        transform-style: preserve-3d;
        transform: rotateX(0deg) rotateY(-12deg) rotateZ(0deg);
        will-change: transform;
      }

      .phone::before {
        content: "";
        position: absolute;
        z-index: 2;
        top: 13px;
        left: 50%;
        width: 28%;
        height: 22px;
        border-radius: 0 0 14px 14px;
        background: #07070e;
        transform: translateX(-50%);
        pointer-events: none;
      }

      .phone::after {
        content: "";
        position: absolute;
        top: 18%;
        left: -4px;
        width: 3px;
        height: 19%;
        border-radius: 3px 0 0 3px;
        background: #34364e;
        box-shadow: 0 58px 0 #34364e;
      }

      .screen {
        position: relative;
        width: 100%;
        height: 100%;
        overflow: hidden;
        border-radius: clamp(26px, 3.4vh, 38px);
        background:
          radial-gradient(circle at 80% 12%, rgba(94, 157, 255, 0.32), transparent 30%),
          linear-gradient(150deg, #06136f 0%, #1428a1 52%, #050d53 100%);
        box-shadow: inset 0 0 0 1px rgba(255, 255, 255, 0.08);
        transform: translateZ(2px);
      }

      .screen::before {
        content: "";
        position: absolute;
        inset: 0;
        background: linear-gradient(
          112deg,
          transparent 30%,
          rgba(255, 255, 255, 0.17) 48%,
          transparent 60%
        );
        transform: translateX(-130%);
        animation: glare 4.8s ease-in-out infinite;
      }

      .screen-content {
        position: absolute;
        inset: 0;
        display: flex;
        flex-direction: column;
        padding: 28px 20px 20px;
        color: var(--cream);
      }

      .status-bar {
        display: flex;
        justify-content: space-between;
        color: rgba(244, 241, 232, 0.68);
        font-size: 9px;
        letter-spacing: 0.04em;
      }

      .brand {
        margin-top: 56px;
        color: var(--blue);
        font-size: 12px;
        font-weight: 700;
        letter-spacing: 0.16em;
        text-transform: uppercase;
      }

      .screen h1 {
        max-width: 180px;
        margin: 10px 0 0;
        font-size: 29px;
        line-height: 0.98;
        letter-spacing: -0.06em;
      }

      .screen-copy {
        max-width: 170px;
        margin-top: 14px;
        color: rgba(244, 241, 232, 0.66);
        font-size: 11px;
        line-height: 1.45;
      }

      .payment-card {
        margin-top: auto;
        padding: 16px;
        border: 1px solid rgba(255, 255, 255, 0.16);
        border-radius: 18px;
        background: rgba(4, 13, 109, 0.56);
        box-shadow: 0 16px 30px rgba(0, 0, 0, 0.18);
        backdrop-filter: blur(10px);
      }

      .payment-label {
        color: rgba(244, 241, 232, 0.55);
        font-size: 9px;
        text-transform: uppercase;
        letter-spacing: 0.1em;
      }

      .payment-amount {
        margin-top: 6px;
        color: var(--cream);
        font-size: 25px;
        font-weight: 700;
      }

      .payment-line {
        height: 1px;
        margin: 14px 0 10px;
        background: rgba(255, 255, 255, 0.16);
      }

      .payment-meta {
        display: flex;
        justify-content: space-between;
        color: rgba(244, 241, 232, 0.64);
        font-size: 9px;
      }

      .hint {
        position: fixed;
        right: 18px;
        bottom: 16px;
        left: 18px;
        color: rgba(244, 241, 232, 0.45);
        font-size: 11px;
        text-align: center;
      }

      @keyframes glare {
        0%,
        35% {
          transform: translateX(-130%);
        }
        65%,
        100% {
          transform: translateX(130%);
        }
      }

      @media (prefers-reduced-motion: reduce) {
        .screen::before {
          animation: none;
        }
      }
    </style>
  </head>
  <body>
    <div class="phone-stage" aria-label="Interactive TaptPay 3D phone model">
      <div class="phone" role="img" aria-label="TaptPay mobile phone">
        <div class="screen">
          <div class="screen-content">
            <div class="status-bar">
              <span>9:41</span>
              <span>••• 100%</span>
            </div>
            <div class="brand">TaptPay</div>
            <h1>Your phone is the terminal.</h1>
            <p class="screen-copy">
              Digital payments, invoices and rent splits in one simple place.
            </p>
            <div class="payment-card">
              <div class="payment-label">Today's takings</div>
              <div class="payment-amount">$2,480.00</div>
              <div class="payment-line"></div>
              <div class="payment-meta">
                <span>24 payments</span>
                <span>+12.4%</span>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
    <div class="hint">Drag to rotate</div>

    <script>
      const stage = document.querySelector(".phone-stage");
      const phone = document.querySelector(".phone");
      let dragging = false;
      let pointerId = null;
      let lastX = 0;
      let lastY = 0;
      let rotX = 0;
      let rotY = -12;

      function render() {
        phone.style.transform =
          `rotateX(${rotX}deg) rotateY(${rotY}deg) rotateZ(0deg)`;
      }

      stage.addEventListener("pointerdown", (event) => {
        dragging = true;
        pointerId = event.pointerId;
        lastX = event.clientX;
        lastY = event.clientY;
        stage.setPointerCapture(pointerId);
      });

      stage.addEventListener("pointermove", (event) => {
        if (!dragging || event.pointerId !== pointerId) return;
        rotY += (event.clientX - lastX) * 0.55;
        rotX -= (event.clientY - lastY) * 0.4;
        rotX = Math.max(-28, Math.min(28, rotX));
        lastX = event.clientX;
        lastY = event.clientY;
        render();
      });

      function stopDragging() {
        dragging = false;
        pointerId = null;
      }

      stage.addEventListener("pointerup", stopDragging);
      stage.addEventListener("pointercancel", stopDragging);
      render();
    </script>
  </body>
</html>
