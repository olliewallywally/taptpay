name: secret scan
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  secrets:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: install pinned scanner with verified release checksum
        shell: bash
        run: |
          curl --fail --silent --show-error --location https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz --output "$RUNNER_TEMP/gitleaks.tar.gz"
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  $RUNNER_TEMP/gitleaks.tar.gz" | sha256sum --check --status
          mkdir "$RUNNER_TEMP/scanner-bin"
          tar -xzf "$RUNNER_TEMP/gitleaks.tar.gz" -C "$RUNNER_TEMP/scanner-bin" gitleaks
          echo "$RUNNER_TEMP/scanner-bin" >> "$GITHUB_PATH"
      - name: configuration and scan safety tests
        run: |
          node scripts/config-hygiene.test.mjs
          node scripts/scan-secrets.test.mjs
      - name: current source scan (metadata only)
        run: node scripts/scan-secrets.mjs tree
      # Exits non-zero on UNDISPOSITIONED findings, not on findings as such: a
      # fully-reviewed history passes, and a known-but-unrevoked credential is
      # deliberately kept red. See docs/operations/secret-scan-dispositions.md.
      - name: history scan (metadata only)
        if: ${{ !cancelled() }}
        shell: bash
        run: |
          set -o pipefail
          status=0
          node scripts/scan-secrets.mjs history | tee "$RUNNER_TEMP/history.jsonl" || status=$?
          summary=$(tail -n 1 "$RUNNER_TEMP/history.jsonl")
          echo "History scan: \`$summary\`" >> "$GITHUB_STEP_SUMMARY"
          if [ "$status" -ne 0 ]; then
            echo "::error title=Undispositioned secret-scan findings::$summary. Review each with 'git show <commit>:<path>' and record a decision in .gitleaks-dispositions.jsonl — see docs/operations/secret-scan-dispositions.md. Do not disposition a live credential as cleared; rotate it first."
          fi
          exit "$status"
