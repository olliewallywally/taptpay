name: verification
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
concurrency:
  group: verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  RECORDED: docs/evidence/remediation-v2-2/r6/R6-through-0049b-fingerprint-2026-10-15.json

jobs:
  static:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: frozen dependency install
        run: npm ci --no-audit --no-fund && git diff --exit-code -- package-lock.json
      - name: PHP CLI for unsupported WooCommerce containment checks
        run: php --version
      - run: npm run verify:ci -- --stage=static
      - run: npm run verify:ci -- --stage=lint
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: static-sanitized
          path: ${{ runner.temp }}/r8-sanitized/*.json
          retention-days: 7

  unit:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --no-audit --no-fund && git diff --exit-code -- package-lock.json
      - run: npm run verify:ci -- --stage=unit
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: unit-sanitized
          path: ${{ runner.temp }}/r8-sanitized/*.json
          retention-days: 7

  build-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        context: [phone, tablet, desktop, desktop-short]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --no-audit --no-fund && git diff --exit-code -- package-lock.json
      - run: npm run verify:ci -- --stage=build
      - name: coherent Capacitor dependency metadata and complete native asset copy
        run: npx cap sync ios && npm run verify:r7:artifacts -- --native && git diff --exit-code -- ios/App/CapApp-SPM/Package.swift
      - run: npx playwright install --with-deps chromium
      - name: owned HTTPS app, readyz, device/tutorial/chunk/terminal checks
        run: npm run verify:ci -- --stage=browser --context=${{ matrix.context }}
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: browser-${{ matrix.context }}-sanitized
          path: ${{ runner.temp }}/r8-sanitized/*.json
          retention-days: 7

  postgres:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: r8_ci_admin
          POSTGRES_PASSWORD: disposable-ci-only
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      R8_CI_ADMIN_URL: postgres://r8_ci_admin:disposable-ci-only@127.0.0.1:5432/postgres?sslmode=disable
      TAPTPAY_TEST_DATABASE: '1'
      # The guarded runner creates a random r8_ci_<16 hex> database and supplies
      # TEST_DATABASE_URL only to that database's owned verifier process.
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --no-audit --no-fund && git diff --exit-code -- package-lock.json
      - run: npm run verify:ci -- --stage=postgres
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: postgres-sanitized
          path: ${{ runner.temp }}/r8-sanitized/*.json
          retention-days: 7

  dependency-report:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --no-audit --no-fund && git diff --exit-code -- package-lock.json
      - name: high and critical advisories block; no implicit waivers
        run: npm run verify:ci -- --stage=audit
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dependencies-sanitized
          path: ${{ runner.temp }}/r8-sanitized/*.json
          retention-days: 7
