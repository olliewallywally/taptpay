# The gates that docs/PLAN-2026-08-17-mobile-responsive-ui.md §7.5 asks for.
#
# WHY THIS EXISTS. Every defect that plan is about lives below `max-width: 640px`,
# and every probe the repo had before it ran at >=1194px — so the entire class was
# invisible to CI. It was invisible to CI twice over, in fact, because there was no
# CI: `verify:mobile`, `verify:mobile-keyboard` and `verify:terminal-dock` were
# commands a human had to remember to type.
#
# WHY IT IS SPLIT UP. §7.6: "Do not ship a permanently failing command." The
# `static` job needs nothing but the repo and is green from the first run. The
# browser gates need a live database — the app talks Neon over `@neondatabase/serverless`
# (server/db.ts:1), so a stock `postgres:` service container cannot stand in for it
# without a websocket proxy. Rather than fail red on every fork and every repo that
# has no DATABASE_URL, `preflight` reports whether the secret exists and the gates
# SKIP when it does not. A skipped job is honest; a red one teaches people to ignore CI.
#
# `migration-convergence` is the exception to that constraint, and R0-T6A's proof.
# The migration runner talks plain `pg` rather than the app's Neon driver, so a
# service container serves it perfectly well — no secret, green on forks, and it
# never touches a database anyone owns.

name: verify

on:
  push:
    branches: [main, "feat/**"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  static:
    name: typecheck + client unit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: tsc
        run: npm run check
      - name: operator backup safety (synthetic subprocesses only)
        run: npm run test:backup:safety
      - name: schema fingerprint determinism (no database opened)
        run: npm run test:fingerprint
      # test:client, not test — the server project needs a database, so it runs
      # in browser-gates below where one exists.
      - name: jest (client)
        run: npm run test:client

  # R0-T6A's convergence proof, and the only migration gate that needs no
  # secrets — so it is green on forks and on every PR. The runner talks plain
  # `pg`, which a stock service container serves perfectly well; it is the app
  # that needs Neon's WebSocket driver, and the app is not involved here.
  migration-convergence:
    name: migrations converge on an empty database
    needs: static
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: migrator
          POSTGRES_PASSWORD: migrator
          POSTGRES_DB: convergence
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      # Loopback, disposable, and declared as such. The runner refuses to treat
      # anything non-loopback as `local`, so this cannot drift onto a real host.
      DATABASE_URL: postgres://migrator:migrator@127.0.0.1:5432/convergence?sslmode=disable
      MIGRATION_ARGS: >-
        --target=local
        --expected-host=127.0.0.1
        --expected-port=5432
        --expected-database=convergence
      # Gap 13: migrations 0023–0025 set invoice-document ownership and run only
      # with an approved ownership inventory. This database starts empty, so its
      # inventory is empty and bound to exactly this target; editing the file
      # means re-approving it here. See docs/operations/migration-release.md.
      UPLOAD_OWNERSHIP_INVENTORY: .github/upload-ownership-inventory.ci-convergence.json
      UPLOAD_OWNERSHIP_INVENTORY_SHA256: e65e4847b72f9ea3933a381bb249fe6adf39eafb6bd35dfa9eb92231d199ff19
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      - name: migration safety preflight
        run: >-
          npm run db:migrate -- $MIGRATION_ARGS --dry-run
          --upload-ownership-inventory=$UPLOAD_OWNERSHIP_INVENTORY
          --upload-ownership-inventory-sha256=$UPLOAD_OWNERSHIP_INVENTORY_SHA256

      # db:release, not db:migrate: it re-plans afterwards and fails unless the
      # database reports 0 pending / 0 drifted / 0 orphaned.
      - name: apply every migration to an empty database
        run: >-
          npm run db:release -- $MIGRATION_ARGS
          --upload-ownership-inventory=$UPLOAD_OWNERSHIP_INVENTORY
          --upload-ownership-inventory-sha256=$UPLOAD_OWNERSHIP_INVENTORY_SHA256

      - name: the applied history is clean
        run: npm run db:migrate:status -- $MIGRATION_ARGS

      # The fingerprint covers only the `public` schema and carries no database
      # name, user, OID, size, statistic or timestamp, so it is identical
      # whatever the target is called. A diff here means the migrations no
      # longer build the reviewed schema — regenerate deliberately, never to
      # make the gate pass.
      - name: the schema matches the recorded fingerprint
        env:
          FINGERPRINT_DATABASE_URL: ${{ env.DATABASE_URL }}
          # 2026-09-21: 0022–0025 added 3 tables, 21 columns, 5 constraints, 1
          # foreign key and 6 indexes and removed nothing (v2: 0025's table also
          # records locked documents) — itemised in
          # docs/evidence/remediation-v2-2/r1/R1-T7-gap13-ownership-inventory-gate-2026-09-21.md.
          # 2026-09-21 (R1-T4): 0026–0028 added 2 tables, 12 columns, 3
          # constraints, 1 foreign key and 4 indexes and removed nothing.
          RECORDED: docs/evidence/remediation-v2-2/r1/R1-T4-empty-fingerprint-2026-09-21.json
        run: |
          node scripts/schema-fingerprint.mjs > "$RUNNER_TEMP/fingerprint.json"
          node -e "
            const read = (p) => JSON.parse(require('fs').readFileSync(p, 'utf8')).digest;
            const recorded = read(process.env.RECORDED);
            const actual = read(process.env.RUNNER_TEMP + '/fingerprint.json');
            console.log('recorded: ' + recorded);
            console.log('actual:   ' + actual);
            if (recorded !== actual) process.exitCode = 1;
          "
          git --no-pager diff --no-index --exit-code "$RECORDED" "$RUNNER_TEMP/fingerprint.json"

  preflight:
    name: can the browser gates run here?
    runs-on: ubuntu-latest
    outputs:
      has_db: ${{ steps.probe.outputs.has_db }}
    steps:
      - id: probe
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          if [ -n "$DATABASE_URL" ]; then
            echo "has_db=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_db=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=Browser gates skipped::DATABASE_URL is not configured for this repository, so the mobile gates and goldens cannot boot the app. This is a skip, not a failure — see docs/PLAN-2026-08-17-mobile-responsive-ui.md §7.6."
          fi

  browser-gates:
    name: mobile gates + goldens
    needs: [static, preflight]
    if: needs.preflight.outputs.has_db == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      JWT_SECRET: ${{ secrets.JWT_SECRET }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      # The probes normally launch the nix-store Chromium, because the bundled one
      # is broken on the dev host (missing libnspr4). Off that host there is no nix
      # store, so PLAYWRIGHT_CHROMIUM_PATH points them at the downloaded browser.
      - name: install chromium
        run: npx playwright install --with-deps chromium
      - name: resolve the chromium binary
        run: |
          echo "PLAYWRIGHT_CHROMIUM_PATH=$(node -e "import('playwright').then(p => console.log(p.chromium.executablePath()))")" >> "$GITHUB_ENV"

      # The runner now refuses to migrate a database the command did not name
      # (R0-T6A, docs/operations/migration-target.md). Which database CI may
      # migrate is an owner decision recorded in repository variables, not a
      # default this step is allowed to invent.
      - name: apply migrations
        env:
          MIGRATION_TARGET: ${{ vars.MIGRATION_TARGET }}
          MIGRATION_EXPECTED_HOST: ${{ vars.MIGRATION_EXPECTED_HOST }}
          MIGRATION_EXPECTED_PORT: ${{ vars.MIGRATION_EXPECTED_PORT }}
          MIGRATION_EXPECTED_DATABASE: ${{ vars.MIGRATION_EXPECTED_DATABASE }}
        run: |
          if [ -z "$MIGRATION_TARGET" ] || [ -z "$MIGRATION_EXPECTED_HOST" ] || [ -z "$MIGRATION_EXPECTED_DATABASE" ]; then
            echo "::error title=Migration target not declared::Set the MIGRATION_TARGET, MIGRATION_EXPECTED_HOST and MIGRATION_EXPECTED_DATABASE repository variables (MIGRATION_EXPECTED_PORT is optional) to declare which database CI may migrate. See docs/operations/migration-target.md."
            exit 1
          fi
          npm run db:migrate -- \
            --target="$MIGRATION_TARGET" \
            --expected-host="$MIGRATION_EXPECTED_HOST" \
            ${MIGRATION_EXPECTED_PORT:+--expected-port="$MIGRATION_EXPECTED_PORT"} \
            --expected-database="$MIGRATION_EXPECTED_DATABASE"

      - name: start the dev server
        run: |
          npm run dev > /tmp/dev.log 2>&1 &
          for i in $(seq 1 120); do
            if curl -fsS -o /dev/null http://127.0.0.1:5000/; then
              echo "dev server up after ${i}s"; exit 0
            fi
            sleep 1
          done
          echo "dev server never answered on :5000"; cat /tmp/dev.log; exit 1

      # Vite transforms the module graph on the first browser load; a cold first
      # goto can exceed the probes' own 30s navigation timeout and fail as if the
      # app were broken. Pay that cost once, here, where it reads as a warm-up.
      - name: warm the module graph
        run: |
          curl -fsS -o /dev/null http://127.0.0.1:5000/terminal
          curl -fsS -o /dev/null http://127.0.0.1:5000/property/terminal
          curl -fsS -o /dev/null http://127.0.0.1:5000/trades/terminal

      - name: jest (server)
        run: npm run test:server

      - name: geometry gate (§7.2)
        run: npm run verify:mobile

      - name: keyboard gate (§K)
        run: npm run verify:mobile-keyboard

      - name: goldens (§7.1)
        run: npm run test:golden

      # §9.F's frame-budget clauses measure worst-frame time, which on a shared
      # runner reports 18/35/40/63ms across four runs of identical code. Every
      # other clause in this gate is geometry and is deterministic, so the gate
      # still earns its place — but it advises, it does not block, until those
      # clauses are made load-independent.
      - name: dock gate (§9, advisory — see comment)
        continue-on-error: true
        run: npm run verify:terminal-dock

      - name: desktop P0 regression boundary
        run: node scripts/verify-desktop-p0.mjs

      - name: collect failure evidence
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: verify-evidence
          path: |
            /tmp/dev.log
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 7
